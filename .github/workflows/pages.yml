name: site

# The site is generated from SPEC.md, skill/SKILL.md, schema/ and profiles/
# on every push. Nothing is hand-copied and the built output is not
# committed, so the site cannot drift from the specification it publishes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate before publishing
        run: |
          PYTHONPATH=src python -m oifmd validate board
          PYTHONPATH=src python -m oifmd validate examples/minimal
      - name: Build
        run: python site/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
